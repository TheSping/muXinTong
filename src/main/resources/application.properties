spring.application.name=Muye

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/muxintong?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus SQL 日志输出
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 区块链节点配置
app.blockchain.peers=127.0.0.1:20200
app.blockchain.group-id=1
app.blockchain.cert-path=conf
app.blockchain.use-sm-crypto=false

# 智能合约地址（部署 CowAssetChain 后替换为实际地址）
app.contract.cow-asset-address=0xf14e0d750650fc0a0062e0059dab772999122dd7